 <style>
  /* --- WARNING OVERLAY STYLES --- */
  .music-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100vh;
    background-color: #0b0b0b;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 9999; 
    transition: opacity 0.5s ease;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: #fff;
    padding: 20px;
    box-sizing: border-box;
  }
  .warning-text {
    font-size: 22px;
    font-weight: bold;
    color: #ff3333;
    margin-bottom: 5px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .sub-text {
    font-size: 15px;
    color: #bbb;
    margin-bottom: 25px;
  }
  .enter-btn {
    padding: 15px 40px;
    font-size: 16px;
    cursor: pointer;
    background-color: #fff;
    color: #000;
    border: none;
    border-radius: 25px;
    font-weight: bold;
    box-shadow: 0px 4px 15px rgba(255,255,255,0.1);
  }

  /* --- MINI AUDIO PLAYER BOARD --- */
  .custom-player {
    position: fixed;
    bottom: 20px; 
    right: 20px;
    background-color: #181818;
    border: 1px solid #282828;
    border-radius: 12px;
    padding: 12px 18px;
    width: 260px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    box-shadow: 0px 8px 24px rgba(0,0,0,0.5);
    z-index: 9998; 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: #fff;
  }
  
  /* Song Info Display */
  .player-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .track-title {
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .track-status {
    font-size: 11px;
    color: #b3b3b3;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  /* Control Row Layout */
  .player-controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 4px;
  }
  .action-btn {
    background: #fff;
    color: #000;
    border: none;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: bold;
    border-radius: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: background 0.2s;
  }
  .action-btn:hover {
    background: #e6e6e6;
  }
  .mute-icon-btn {
    background: transparent;
    border: none;
    color: #b3b3b3;
    font-size: 18px;
    cursor: pointer;
    padding: 4px;
    transition: color 0.2s;
  }
  .mute-icon-btn:hover {
    color: #fff;
  }
</style>

<!-- Hidden Audio Element -->
<audio id="bg-music" src="I deserve this.mp3" loop></audio>

<!-- The Warning Overlay Screen -->
<div id="overlay" class="music-overlay">
  <div class="warning-text">⚠️ Audio Warning</div>
  <div class="sub-text">This website plays explicit music with bad words out!</div>
  <button class="enter-btn" onclick="startWebsite()">Unmute & Enter</button>
</div>

<!-- Complete Custom Audio Player -->
<div class="custom-player">
  <div class="player-info">
    <div id="status-text" class="track-status">Playing</div>
    <div class="track-title">I deserve this</div>
  </div>
  
  <div class="player-controls">
    <!-- Play/Pause Button Toggle -->
    <button id="master-play-btn" class="action-btn" onclick="togglePlay()">
      <span id="play-icon">⏸</span> <span id="play-text">Pause</span>
    </button>
    <!-- Mute Button Toggle -->
    <button id="master-mute-btn" class="mute-icon-btn" onclick="toggleMute()" title="Mute/Unmute">
      🔊
    </button>
  </div>
</div>

<script>
  var audio = document.getElementById("bg-music");

  function startWebsite() {
    var overlay = document.getElementById("overlay");
    audio.play(); 
    
    overlay.style.opacity = "0";
    setTimeout(function() {
      overlay.style.display = "none";
    }, 500); 
  }

  function togglePlay() {
    var playIcon = document.getElementById("play-icon");
    var playText = document.getElementById("play-text");
    var statusText = document.getElementById("status-text");

    if (audio.paused) {
      audio.play();
      playIcon.innerHTML = "⏸";
      playText.innerHTML = "Pause";
      statusText.innerHTML = "Playing";
      statusText.style.color = "#1db954"; /* Spotify Green when playing */
    } else {
      audio.pause();
      playIcon.innerHTML = "▶";
      playText.innerHTML = "Play";
      statusText.innerHTML = "Paused";
      statusText.style.color = "#b3b3b3";
    }
  }

  function toggleMute() {
    var muteBtn = document.getElementById("master-mute-btn");

    if (audio.muted) {
      audio.muted = false;
      muteBtn.innerHTML = "🔊";
    } else {
      audio.muted = true;
      muteBtn.innerHTML = "🔇";
    }
  }
</script>
