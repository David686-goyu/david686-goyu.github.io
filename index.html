 <style>
  /* --- WARNING OVERLAY STYLES --- */
  .music-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100vh;
    background-color: #0b0b0b;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 9999; 
    transition: opacity 0.5s ease;
    font-family: Arial, sans-serif;
    color: #fff;
    padding: 20px;
    box-sizing: border-box;
  }
  .warning-text {
    font-size: 22px;
    font-weight: bold;
    color: #ff3333;
    margin-bottom: 5px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .sub-text {
    font-size: 15px;
    color: #bbb;
    margin-bottom: 25px;
  }
  .enter-btn {
    padding: 15px 40px;
    font-size: 16px;
    cursor: pointer;
    background-color: #fff;
    color: #000;
    border: none;
    border-radius: 25px;
    font-weight: bold;
  }

  /* --- CONTROL BUTTONS STYLES --- */
  .audio-controls-container {
    position: fixed;
    bottom: 20px; /* Sits in the bottom-right corner */
    right: 20px;
    display: flex;
    gap: 10px;
    z-index: 9998; /* Sits right beneath the overlay layer */
    font-family: Arial, sans-serif;
  }
  .control-btn {
    background-color: rgba(0, 0, 0, 0.7);
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.3);
    padding: 10px 15px;
    font-size: 14px;
    border-radius: 20px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .control-btn:hover {
    background-color: rgba(0, 0, 0, 0.9);
  }
</style>

<!-- Hidden Audio Element -->
<audio id="bg-music" src="I deserve this" loop></audio>

<!-- The Warning Overlay Screen -->
<div id="overlay" class="music-overlay">
  <div class="warning-text">⚠️ Audio Warning</div>
  <div class="sub-text">This website plays explicit music with bad words out!<div>
  <button class="enter-btn" onclick="startWebsite()">Unmute & Enter</button>
</div>

<!-- Floating Controls (Visible on your site after entry) -->
<div class="audio-controls-container">
  <button id="play-pause-btn" class="control-btn" onclick="togglePlay()">⏸ Pause</button>
  <button id="mute-btn" class="control-btn" onclick="toggleMute()">🔊 Mute</button>
</div>

<script>
  var audio = document.getElementById("bg-music");

  function startWebsite() {
    var overlay = document.getElementById("overlay");
    audio.play(); 
    
    overlay.style.opacity = "0";
    setTimeout(function() {
      overlay.style.display = "none";
    }, 500); 
  }

  // Handles Play and Pause
  function togglePlay() {
    var playPauseBtn = document.getElementById("play-pause-btn");
    if (audio.paused) {
      audio.play();
      playPauseBtn.innerHTML = "⏸ Pause";
    } else {
      audio.pause();
      playPauseBtn.innerHTML = "▶ Play";
    }
  }

  // Handles Mute and Unmute
  function toggleMute() {
    var muteBtn = document.getElementById("mute-btn");
    if (audio.muted) {
      audio.muted = false;
      muteBtn.innerHTML = "🔊 Mute";
    } else {
      audio.muted = true;
      muteBtn.innerHTML = "🔇 Unmute";
    }
  }
</script>
